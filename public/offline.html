<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Tourliz</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .icon-container {
            color: #ef4444;
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; color: #f87171; }
        }
        .icon-container svg { width: 64px; height: 64px; }
        h2 { margin: 0 0 12px; font-size: 1.7rem; }
        p { margin: 0 0 24px; color: #94a3b8; line-height: 1.6; }
        .btn-retry {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            color: white;
            font-weight: 500;
            padding: 12px 28px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4);
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5.13A15.3 15.3 0 0 1 22 8.82M5 12.86a10 10 0 0 1 3.19-1.74M12.67 10.93A10 10 0 0 1 19 12.86M8.5 16.43a5 5 0 0 1 7 0M12 20h.01M3 3l18 18" />
            </svg>
        </div>
        <h2>Connection Lost</h2>
        <p>Tourliz CMS needs an internet connection to protect customer data and load the latest information.</p>
        <button onclick="window.location.reload();" class="btn-retry">
            Retry Connection
        </button>
    </div>
</body>
</html>
